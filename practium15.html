
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA - Productivity Dashboard</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Arial, sans-serif;
    transition: background 0.3s, color 0.3s;
}

body.light {
    --bg: #f5f6fc;
    --card: #ffffff;
    --text: #1e2440;
    --muted: #77809a;
    --border: #e6e9f2;
    --accent: #7357e8;
    --soft: #eeeaff;
    --shadow: rgba(40,40,90,0.07);
}

body.dark {
    --bg: #0d1020;
    --card: #191e33;
    --text: #f5f6ff;
    --muted: #a0a9c3;
    --border: #303750;
    --accent: #a38bff;
    --soft: #302a53;
    --shadow: rgba(0,0,0,0.25);
}

body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
}

/* NAVIGATION */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 22px 7%;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    gap: 15px;
}

.logo {
    font-size: 27px;
    font-weight: 800;
    color: var(--accent);
}

.nav-right {
    display: flex;
    align-items: center;
    gap: 20px;
}

.theme-toggle {
    padding: 11px 20px;
    border: 1px solid var(--border);
    border-radius: 30px;
    background: var(--soft);
    color: var(--text);
    cursor: pointer;
    font-weight: 600;
}

/* MAIN CONTENT */
.container {
    max-width: 1150px;
    margin: 45px auto;
    padding: 0 20px;
}

.welcome {
    margin-bottom: 35px;
}

.welcome h1 {
    font-size: clamp(28px, 4vw, 40px);
    margin-bottom: 10px;
}

.welcome p {
    color: var(--muted);
}

/* STATISTICS */
.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 30px;
}

.stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 27px;
    border-radius: 17px;
    box-shadow: 0 8px 25px var(--shadow);
}

.stat-icon {
    font-size: 30px;
    margin-bottom: 15px;
}

.stat-card p {
    color: var(--muted);
    margin-bottom: 10px;
}

.stat-card h2 {
    font-size: 35px;
}

/* DASHBOARD GRID */
.dashboard-grid {
    display: grid;
    grid-template-columns: 1.5fr 1fr;
    gap: 25px;
}

.panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 17px;
    padding: 28px;
    box-shadow: 0 8px 25px var(--shadow);
}

.panel h2 {
    margin-bottom: 22px;
    font-size: 22px;
}

/* ADD TASK */
.task-form {
    display: flex;
    gap: 10px;
    margin-bottom: 22px;
}

.task-form input {
    flex: 1;
    min-width: 0;
    padding: 13px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
}

.task-form button,
.action-button {
    background: var(--accent);
    color: #ffffff;
    border: none;
    padding: 13px 18px;
    border-radius: 9px;
    cursor: pointer;
    font-weight: 600;
}

/* TASK ITEMS */
.task-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 12px;
}

.task-item label {
    display: flex;
    align-items: center;
    gap: 12px;
    overflow-wrap: anywhere;
    cursor: pointer;
}

.task-item input {
    width: 18px;
    height: 18px;
    accent-color: var(--accent);
}

.task-item.completed span {
    text-decoration: line-through;
    color: var(--muted);
}

.delete-button {
    background: #fee2e2;
    color: #b91c1c;
    border: none;
    padding: 8px 12px;
    border-radius: 7px;
    cursor: pointer;
}

/* PROGRESS */
.progress-track {
    height: 13px;
    background: var(--soft);
    border-radius: 20px;
    overflow: hidden;
    margin: 20px 0;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg,#7357e8,#28c8c3);
    transition: width 0.4s;
}

.progress-text {
    color: var(--muted);
    line-height: 1.7;
}

/* CLOCK */
.clock {
    text-align: center;
    padding: 35px 10px;
    background: var(--soft);
    border-radius: 13px;
    margin-top: 25px;
}

.clock h3 {
    font-size: clamp(28px, 4vw, 40px);
    color: var(--accent);
}

.clock p {
    color: var(--muted);
    margin-top: 10px;
}

/* FOOTER */
footer {
    text-align: center;
    padding: 30px;
    color: var(--muted);
    font-size: 13px;
}

/* RESPONSIVE */
@media(max-width: 800px) {
    .dashboard-grid {
        grid-template-columns: 1fr;
    }

    .stats {
        grid-template-columns: 1fr;
    }
}

@media(max-width: 500px) {
    .navbar {
        padding: 18px;
    }

    .panel {
        padding: 20px;
    }

    .task-form {
        flex-direction: column;
    }

    .theme-toggle {
        padding: 10px;
    }
}
</style>
</head>

<body class="dark">

<header class="navbar">
    <div class="logo">✦ NOVA</div>

    <div class="nav-right">
        <button class="theme-toggle"
                id="themeButton"
                onclick="toggleTheme()">
            ☀️ Light Mode
        </button>
    </div>
</header>

<main class="container">

    <section class="welcome">
        <h1>Welcome to NOVA ✨</h1>
        <p>Organize your day. Focus on what matters.</p>
    </section>

    <!-- STATISTICS -->
    <section class="stats">
        <div class="stat-card">
            <div class="stat-icon">📋</div>
            <p>Total Tasks</p>
            <h2 id="totalTasks">0</h2>
        </div>

        <div class="stat-card">
            <div class="stat-icon">✅</div>
            <p>Completed Tasks</p>
            <h2 id="completedTasks">0</h2>
        </div>

        <div class="stat-card">
            <div class="stat-icon">⏳</div>
            <p>Pending Tasks</p>
            <h2 id="pendingTasks">0</h2>
        </div>
    </section>

    <div class="dashboard-grid">

        <!-- TASK MANAGER -->
        <section class="panel">
            <h2>📝 My Tasks</h2>

            <form class="task-form" id="taskForm">
                <input type="text"
                       id="taskInput"
                       placeholder="What do you need to do?"
                       maxlength="120"
                       required>

                <button type="submit">+ Add Task</button>
            </form>

            <div id="taskList"></div>
        </section>

        <!-- PROGRESS AND CLOCK -->
        <section class="panel">
            <h2>🎯 Daily Progress</h2>

            <p class="progress-text">
                Track your completed tasks and stay productive.
            </p>

            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <p class="progress-text" id="progressText">
                0% completed
            </p>

            <div class="clock">
                <h3 id="digitalClock">00:00:00</h3>
                <p id="currentDate"></p>
            </div>
        </section>

    </div>

</main>

<footer>
    © 2026 NOVA | Your Personal Productivity Space
</footer>

<script>

/* ELEMENTS */
const taskForm = document.getElementById("taskForm");
const taskInput = document.getElementById("taskInput");
const taskList = document.getElementById("taskList");

const themeButton =
    document.getElementById("themeButton");

const STORAGE_KEY = "novaProductivityTasks";
const THEME_KEY = "novaDashboardTheme";

/* TASK DATA */
let tasks = [];

/* LOAD SAVED TASKS */
function loadTasks() {
    try {
        const savedTasks = localStorage.getItem(STORAGE_KEY);
        const parsedTasks = savedTasks
            ? JSON.parse(savedTasks)
            : [];

        tasks = Array.isArray(parsedTasks) ? parsedTasks : [];
    } catch (error) {
        tasks = [];
    }

    displayTasks();
}

/* SAVE TASKS */
function saveTasks() {
    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(tasks)
    );
}

/* ADD TASK */
taskForm.addEventListener("submit", function(event) {
    event.preventDefault();

    const taskName = taskInput.value.trim();

    if (!taskName) return;

    tasks.push({
        id: Date.now() + Math.random(),
        name: taskName,
        completed: false
    });

    taskInput.value = "";

    saveTasks();
    displayTasks();
});

/* DISPLAY TASKS */
function displayTasks() {
    taskList.innerHTML = "";

    if (tasks.length === 0) {
        const message = document.createElement("p");
        message.className = "progress-text";
        message.textContent =
            "No tasks yet. Add your first task!";
        taskList.appendChild(message);
    }

    tasks.forEach(function(task) {
        const taskItem = document.createElement("div");
        taskItem.className =
            "task-item" + (task.completed ? " completed" : "");

        const taskLabel = document.createElement("label");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.completed;

        checkbox.addEventListener("change", function() {
            task.completed = checkbox.checked;
            saveTasks();
            displayTasks();
        });

        const taskText = document.createElement("span");
        taskText.textContent = task.name;

        taskLabel.appendChild(checkbox);
        taskLabel.appendChild(taskText);

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-button";
        deleteButton.textContent = "Delete";

        deleteButton.addEventListener("click", function() {
            tasks = tasks.filter(
                item => item.id !== task.id
            );

            saveTasks();
            displayTasks();
        });

        taskItem.appendChild(taskLabel);
        taskItem.appendChild(deleteButton);
        taskList.appendChild(taskItem);
    });

    updateStatistics();
}

/* UPDATE STATISTICS */
function updateStatistics() {
    const total = tasks.length;
    const completed = tasks.filter(
        task => task.completed
    ).length;

    const pending = total - completed;

    const percentage = total === 0
        ? 0
        : Math.round(completed / total * 100);

    document.getElementById("totalTasks").textContent =
        total;

    document.getElementById("completedTasks").textContent =
        completed;

    document.getElementById("pendingTasks").textContent =
        pending;

    document.getElementById("progressFill").style.width =
        percentage + "%";

    document.getElementById("progressText").textContent =
        percentage + "% completed";
}

/* DARK / LIGHT MODE */
function toggleTheme() {
    const isDark =
        document.body.classList.contains("dark");

    document.body.classList.toggle("dark", !isDark);
    document.body.classList.toggle("light", isDark);

    localStorage.setItem(
        THEME_KEY,
        isDark ? "light" : "dark"
    );

    updateThemeButton();
}

/* UPDATE THEME BUTTON */
function updateThemeButton() {
    const isDark =
        document.body.classList.contains("dark");

    themeButton.textContent =
        isDark ? "☀️ Light Mode" : "🌙 Dark Mode";
}

/* LOAD SAVED THEME */
function loadTheme() {
    const savedTheme = localStorage.getItem(THEME_KEY);

    const isDark = savedTheme !== "light";

    document.body.classList.toggle("dark", isDark);
    document.body.classList.toggle("light", !isDark);

    updateThemeButton();
}

/* DIGITAL CLOCK */
function updateClock() {
    const now = new Date();

    document.getElementById("digitalClock").textContent =
        now.toLocaleTimeString();

    document.getElementById("currentDate").textContent =
        now.toLocaleDateString("en-IN", {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
        });
}

/* INITIALIZE */
loadTheme();
loadTasks();
updateClock();
setInterval(updateClock, 1000);

</script>

</body>
</html>
